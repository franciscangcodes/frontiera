<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">404 – Page not found</title>
  <desc id="d">The number 404 above a freshly planted seed with a tiny sprout and water drops, suggesting the page has just been planted and hasn't grown yet.</desc>
  <rect width="1040" height="700" fill="#DCEFE6"/>

  <!-- 404, the zero is a ring -->
  <g transform="translate(104,-80) scale(0.8)">
    <path fill="#14301F" fill-rule="evenodd"
      d="M350 200L290 200L170 390L170 440L290 440L290 500L350 500L350 440L400 440L400 390L350 390Z
         M290 270L290 390L215 390Z"/>
    <path fill="#14301F" fill-rule="evenodd"
      d="M820 200L760 200L640 390L640 440L760 440L760 500L820 500L820 440L870 440L870 390L820 390Z
         M760 270L760 390L685 390Z"/>
    <circle cx="520" cy="350" r="105" fill="none" stroke="#2F9E5B" stroke-width="42"/>
  </g>

  <!-- message -->
  <text x="520" y="382" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#14301F">This page was just planted.</text>
  <text x="520" y="424" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#3F5F4C">It hasn't grown yet. Check back soon, or head to the homepage.</text>

  <!-- water drops -->
  <g fill="#6BB6E8">
    <path transform="translate(462,462)" d="M0 -11C7 0 9 6 0 11C-9 6 -7 0 0 -11Z"/>
    <path transform="translate(588,452)" d="M0 -11C7 0 9 6 0 11C-9 6 -7 0 0 -11Z"/>
    <path transform="translate(560,480)" d="M0 -9C6 0 7 5 0 9C-7 5 -6 0 0 -9Z"/>
  </g>

  <!-- soil -->
  <path fill="#5B3A29" d="M0 560C200 555 360 500 520 500C680 500 840 555 1040 560V700H0Z"/>
  <path fill="#3E2519" d="M0 648C300 628 740 668 1040 636V700H0Z"/>
  <g fill="#3E2519">
    <circle cx="300" cy="590" r="6"/><circle cx="760" cy="585" r="7"/><circle cx="640" cy="610" r="5"/><circle cx="410" cy="620" r="5"/>
  </g>

  <!-- seed underground -->
  <ellipse cx="520" cy="572" rx="17" ry="24" transform="rotate(-18 520 572)" fill="#C99A5B"/>
  <path d="M513 560q4-8 10-9" fill="none" stroke="#E8CC9A" stroke-width="4" stroke-linecap="round"/>

  <!-- tiny sprout just poking out -->
  <path d="M520 503V484" stroke="#2F9E5B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path fill="#5FD08F" d="M520 488C506 488 497 480 496 468C509 468 518 475 520 488Z"/>
  <path fill="#5FD08F" d="M520 488C534 488 543 480 544 468C531 468 522 475 520 488Z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
